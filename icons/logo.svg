<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)"/>

  <!-- Curved swap arrows -->
  <!-- Arc Top-Right to Bottom-Left -->
  <path d="M 390 200 A 155 155 0 0 1 125 315" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <!-- Arrow Head 1 -->
  <polygon points="115,305 130,345 155,300" fill="#ffffff"/>

  <!-- Arc Bottom-Left to Top-Right -->
  <path d="M 122 312 A 155 155 0 0 1 387 197" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <!-- Arrow Head 2 -->
  <polygon points="397,207 382,167 357,212" fill="#ffffff"/>

  <!-- Student Mortarboard Cap (Center) -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond -->
    <polygon points="256,190 380,240 256,290 132,240" fill="#ffffff"/>
    <!-- Skull Cap Base -->
    <path d="M 188 262 Q 256 310 324 262 L 312 295 Q 256 335 200 295 Z" fill="#f1f5f9"/>
    <!-- Central Button -->
    <circle cx="256" cy="240" r="10" fill="#fbbf24"/>
    <!-- Tassel -->
    <path d="M 256 240 Q 180 250 160 295 L 160 325" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <rect x="154" y="325" width="12" height="25" rx="3" fill="#fbbf24"/>
  </g>
</svg>
