<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troc'Campus — Mode Hors Ligne</title>
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.75rem;
      color: #fbbf24;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      display: inline-block;
      padding: 0.8rem 1.4rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: #0f172a;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--border);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      La ressource demandée n'est pas accessible sans connexion Internet. Rassurez-vous : l'application Troc'Campus et vos annonces enregistrées en local restent pleinement consultables depuis l'accueil !
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Retour à l'accueil (Mode hors ligne)</a>
      <button type="button" class="btn btn-secondary" onclick="window.location.reload()">Réessayer la connexion</button>
    </div>
    <div class="status-badge">
      <span class="dot" id="net-dot"></span>
      <span id="net-label">Réseau déconnecté</span>
    </div>
  </main>

  <script>
    function updateNet() {
      const dot = document.querySelector("#net-dot");
      const label = document.querySelector("#net-label");
      if (navigator.onLine) {
        dot.style.background = "#10b981";
        label.textContent = "Connexion rétablie — redirection...";
        setTimeout(() => window.location.href = "/", 1000);
      } else {
        dot.style.background = "#ef4444";
        label.textContent = "Réseau déconnecté";
      }
    }
    window.addEventListener("online", updateNet);
    window.addEventListener("offline", updateNet);
    updateNet();
  </script>
</body>
</html>
